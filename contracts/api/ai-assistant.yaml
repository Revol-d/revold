openapi: 3.0.3
info:
  title: Core AI Assistant API
  version: "1.0.0"
  description: >
    Contrato do core-ai-assistant (Contract-First, ver ADR-0002 e ADR-0011).
    Assistente de perguntas e respostas sobre o catálogo via RAG
    (embeddings + pgvector) — não fecha pedido sozinho; quando detecta
    intenção de compra, sinaliza para o cliente ser direcionado à conversa
    manual com a Nick pelo WhatsApp (ADR-0005).
servers:
  - url: /api/assistant
paths:
  /ask:
    post:
      operationId: askAssistant
      summary: Pergunta ao assistente (público, usado pelo widget de chat do storefront)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AskAssistantRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantReply" }

  /reindex:
    post:
      operationId: reindexCatalog
      summary: >
        Reindexa todo o catálogo no índice vetorial (uso administrativo,
        papel STAFF/ADMIN)
      security:
        - sessionCookie: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReindexResult" }
        "401":
          description: Sem sessão válida
        "403":
          description: Papel STAFF/ADMIN exigido

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session_id
      description: >
        Cookie HttpOnly de sessão (ADR-0010) — obtido via
        POST /api/auth/login/complete (ver contracts/api/identity.yaml).
  schemas:
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
    AskAssistantRequest:
      type: object
      required: [question]
      properties:
        question: { type: string }
        history:
          type: array
          items: { $ref: "#/components/schemas/ChatMessage" }
          default: []
    RetrievedProduct:
      type: object
      required: [sku, name]
      properties:
        sku: { type: string }
        name: { type: string }
    AssistantReply:
      type: object
      required: [message, escalate_to_whatsapp]
      properties:
        message: { type: string }
        escalate_to_whatsapp:
          type: boolean
          description: >
            true quando o assistente detectou intenção de compra — o
            frontend deve oferecer o link de checkout via WhatsApp
            (ver contracts/api/cart.yaml).
        retrieved_products:
          type: array
          items: { $ref: "#/components/schemas/RetrievedProduct" }
          default: []
    ReindexResult:
      type: object
      required: [products_indexed]
      properties:
        products_indexed: { type: integer, minimum: 0 }
