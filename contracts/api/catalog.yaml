openapi: 3.0.3
info:
  title: Core Catalog API
  version: "1.0.0"
  description: >
    Contrato do core-catalog (Contract-First, ver ADR-0002). Nenhum endpoint é
    implementado sem estar refletido aqui primeiro.
servers:
  - url: /api/catalog
paths:
  /categories:
    get:
      operationId: listCategories
      summary: Lista categorias de produto
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      summary: Cria (ou atualiza) uma categoria — uso administrativo, papel STAFF/ADMIN
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCategoryRequest" }
      responses:
        "201":
          description: Criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "401":
          description: Sem sessão válida
        "403":
          description: Papel STAFF/ADMIN exigido
  /categories/{slug}:
    delete:
      operationId: deleteCategory
      summary: >
        Remove uma categoria — uso administrativo, papel STAFF/ADMIN. Nunca
        cascade-remove produtos: se a categoria ainda tiver algum, retorna 409.
      security:
        - sessionCookie: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Removida
        "401":
          description: Sem sessão válida
        "403":
          description: Papel STAFF/ADMIN exigido
        "404":
          description: Categoria não encontrada
        "409":
          description: Categoria ainda tem produtos — mova ou remova-os antes
  /products:
    get:
      operationId: listProducts
      summary: Lista produtos, com filtro opcional por categoria, busca e ordenação
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: q
          in: query
          required: false
          description: Busca por substring no nome do produto (case-insensitive)
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: >
            Ordenação — filtro e ordenação funcionam via query params (não só
            estado local) para permitir link compartilhável e botão voltar do
            navegador (ver referencia-frontend-storefront.md).
          schema:
            type: string
            enum: [relevance, price_asc, price_desc]
            default: relevance
        - name: size
          in: query
          required: false
          description: >
            Filtra produtos que tenham ao menos uma variante com este
            tamanho (repita o parâmetro para múltiplos valores — combinado
            em OR entre si, e em AND com `color` quando os dois são
            enviados, exigindo que a MESMA variante case ambos).
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: color
          in: query
          required: false
          description: >
            Filtra produtos que tenham ao menos uma variante com esta cor
            (mesma semântica de combinação de `size` acima).
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            default: 24
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
    post:
      operationId: createProduct
      summary: Cria um produto novo — uso administrativo, papel STAFF/ADMIN
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProductRequest" }
      responses:
        "201":
          description: Criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "401":
          description: Sem sessão válida
        "403":
          description: Papel STAFF/ADMIN exigido
        "404":
          description: Categoria não encontrada
        "409":
          description: SKU já existe
  /products/{sku}:
    get:
      operationId: getProduct
      summary: Obtém um produto por SKU
      parameters:
        - name: sku
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Produto não encontrado
    patch:
      operationId: updateProduct
      summary: >
        Atualiza campos de um produto já existente (não mexe nas variantes —
        ver /products/{sku}/variants) — uso administrativo, papel STAFF/ADMIN
      security:
        - sessionCookie: []
      parameters:
        - name: sku
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProductRequest" }
      responses:
        "200":
          description: Atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "401":
          description: Sem sessão válida
        "403":
          description: Papel STAFF/ADMIN exigido
        "404":
          description: Produto (ou nova categoria) não encontrado
    delete:
      operationId: deleteProduct
      summary: Remove um produto e suas variantes — uso administrativo, papel STAFF/ADMIN
      security:
        - sessionCookie: []
      parameters:
        - name: sku
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Removido
        "401":
          description: Sem sessão válida
        "403":
          description: Papel STAFF/ADMIN exigido
        "404":
          description: Produto não encontrado
  /products/{sku}/images:
    post:
      operationId: addProductImage
      summary: >
        Upload de arquivo de imagem de verdade (ADR-0015) — diferente de
        PATCH /products/{sku}, que só aceita substituir a lista inteira de
        imagens por URLs já conhecidas (coladas à mão). Uso administrativo,
        papel STAFF/ADMIN.
      security:
        - sessionCookie: []
      parameters:
        - name: sku
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: >
                    image/jpeg, image/png ou image/webp — máximo de 10MB.
      responses:
        "201":
          description: Imagem enviada e anexada — retorna o produto atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "401":
          description: Sem sessão válida
        "403":
          description: Papel STAFF/ADMIN exigido
        "404":
          description: Produto não encontrado
        "422":
          description: Tipo de arquivo não suportado ou tamanho acima do limite
  /products/{sku}/variants:
    post:
      operationId: addProductVariant
      summary: Adiciona uma variante nova a um produto já existente — uso administrativo, papel STAFF/ADMIN
      security:
        - sessionCookie: []
      parameters:
        - name: sku
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductVariant" }
      responses:
        "201":
          description: Variante adicionada — retorna o produto atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "401":
          description: Sem sessão válida
        "403":
          description: Papel STAFF/ADMIN exigido
        "404":
          description: Produto não encontrado
        "409":
          description: Já existe uma variante com esse SKU neste produto
  /products/{sku}/variants/{variant_sku}:
    patch:
      operationId: updateProductVariant
      summary: >
        Edita tamanho/cor/disponibilidade de uma variante já existente — uso
        administrativo, papel STAFF/ADMIN. O SKU da variante nunca muda por
        aqui (é a mesma chave usada por core-inventory).
      security:
        - sessionCookie: []
      parameters:
        - name: sku
          in: path
          required: true
          schema: { type: string }
        - name: variant_sku
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProductVariantRequest" }
      responses:
        "200":
          description: Variante atualizada — retorna o produto atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "401":
          description: Sem sessão válida
        "403":
          description: Papel STAFF/ADMIN exigido
        "404":
          description: Produto ou variante não encontrados
    delete:
      operationId: removeProductVariant
      summary: Remove uma variante de um produto — uso administrativo, papel STAFF/ADMIN
      security:
        - sessionCookie: []
      parameters:
        - name: sku
          in: path
          required: true
          schema: { type: string }
        - name: variant_sku
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Variante removida — retorna o produto atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "401":
          description: Sem sessão válida
        "403":
          description: Papel STAFF/ADMIN exigido
        "404":
          description: Produto ou variante não encontrados
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session_id
      description: >
        Cookie HttpOnly de sessão (ADR-0010) — obtido via
        POST /api/auth/login/complete (ver contracts/api/identity.yaml).
  schemas:
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: string
          description: Valor decimal como string, para evitar erro de ponto flutuante
        currency:
          type: string
          example: BRL
    Category:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
        name:
          type: string
    ProductVariant:
      type: object
      required: [sku, size, color, in_stock]
      properties:
        sku:
          type: string
        size:
          type: string
        color:
          type: string
        in_stock:
          type: boolean
    Product:
      type: object
      required: [sku, name, category, price, variants, images]
      properties:
        sku:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          $ref: "#/components/schemas/Category"
        price:
          $ref: "#/components/schemas/Money"
        original_price:
          $ref: "#/components/schemas/Money"
        variants:
          type: array
          items:
            $ref: "#/components/schemas/ProductVariant"
        images:
          type: array
          items:
            type: string
            format: uri
    ProductPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
    CreateCategoryRequest:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }
    CreateProductRequest:
      type: object
      required: [sku, name, category_slug, price]
      properties:
        sku: { type: string }
        name: { type: string }
        category_slug: { type: string }
        price: { $ref: "#/components/schemas/Money" }
        description: { type: string, default: "" }
        images:
          type: array
          items: { type: string, format: uri }
          default: []
        original_price: { $ref: "#/components/schemas/Money" }
        variants:
          type: array
          items: { $ref: "#/components/schemas/ProductVariant" }
          default: []
    UpdateProductRequest:
      type: object
      description: >
        Todo campo é opcional: só o que for enviado é alterado.
        `clear_original_price: true` remove um preço original existente.
      properties:
        name: { type: string }
        category_slug: { type: string }
        price: { $ref: "#/components/schemas/Money" }
        description: { type: string }
        images:
          type: array
          items: { type: string, format: uri }
        original_price: { $ref: "#/components/schemas/Money" }
        clear_original_price: { type: boolean, default: false }
    UpdateProductVariantRequest:
      type: object
      description: >
        Todo campo é opcional: só o que for enviado é alterado. O SKU da
        variante não é editável por este schema.
      properties:
        size: { type: string }
        color: { type: string }
        in_stock: { type: boolean }
