openapi: 3.0.3
info:
  title: Core Catalog API
  version: "1.0.0"
  description: >
    Contrato do core-catalog (Contract-First, ver ADR-0002). Nenhum endpoint é
    implementado sem estar refletido aqui primeiro.
servers:
  - url: /api/catalog
paths:
  /categories:
    get:
      operationId: listCategories
      summary: Lista categorias de produto
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      summary: Cria (ou atualiza) uma categoria — uso administrativo, papel STAFF/ADMIN
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCategoryRequest" }
      responses:
        "201":
          description: Criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "401":
          description: Sem sessão válida
        "403":
          description: Papel STAFF/ADMIN exigido
  /products:
    get:
      operationId: listProducts
      summary: Lista produtos, com filtro opcional por categoria
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            default: 24
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
    post:
      operationId: createProduct
      summary: Cria um produto novo — uso administrativo, papel STAFF/ADMIN
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProductRequest" }
      responses:
        "201":
          description: Criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "401":
          description: Sem sessão válida
        "403":
          description: Papel STAFF/ADMIN exigido
        "404":
          description: Categoria não encontrada
        "409":
          description: SKU já existe
  /products/{sku}:
    get:
      operationId: getProduct
      summary: Obtém um produto por SKU
      parameters:
        - name: sku
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Produto não encontrado
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session_id
      description: >
        Cookie HttpOnly de sessão (ADR-0010) — obtido via
        POST /api/auth/login/complete (ver contracts/api/identity.yaml).
  schemas:
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: string
          description: Valor decimal como string, para evitar erro de ponto flutuante
        currency:
          type: string
          example: BRL
    Category:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
        name:
          type: string
    ProductVariant:
      type: object
      required: [sku, size, color, in_stock]
      properties:
        sku:
          type: string
        size:
          type: string
        color:
          type: string
        in_stock:
          type: boolean
    Product:
      type: object
      required: [sku, name, category, price, variants, images]
      properties:
        sku:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          $ref: "#/components/schemas/Category"
        price:
          $ref: "#/components/schemas/Money"
        original_price:
          $ref: "#/components/schemas/Money"
        variants:
          type: array
          items:
            $ref: "#/components/schemas/ProductVariant"
        images:
          type: array
          items:
            type: string
            format: uri
    ProductPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
    CreateCategoryRequest:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }
    CreateProductRequest:
      type: object
      required: [sku, name, category_slug, price]
      properties:
        sku: { type: string }
        name: { type: string }
        category_slug: { type: string }
        price: { $ref: "#/components/schemas/Money" }
        description: { type: string, default: "" }
        images:
          type: array
          items: { type: string, format: uri }
          default: []
        original_price: { $ref: "#/components/schemas/Money" }
        variants:
          type: array
          items: { $ref: "#/components/schemas/ProductVariant" }
          default: []
