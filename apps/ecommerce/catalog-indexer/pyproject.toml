[project]
name = "catalog-indexer"
version = "0.1.0"
description = "Worker Celery que reindexa o catálogo inteiro para o assistente (composition root)."
requires-python = ">=3.12"
# Dependencias internas sem pino: o uv.lock unico e o workspace resolvem a versao.
dependencies = [
    "revold-ai-assistant",
    "revold-catalog",
    "revold-ecommerce",
    "revold-platform",
    "revold-postgres",
    "revold-azure-sql",
    "celery>=5.4,<6",
]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catalog_indexer"]
