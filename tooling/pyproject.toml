[project]
name = "revold-tooling"
version = "0.1.0"
description = "Ferramenta de desenvolvimento do monorepo: manifesto, gates, afetados, build e release."
requires-python = ">=3.12"
dependencies = [
    "import-linter>=2.0,<3",
    "jsonschema>=4.21,<5",
    "pyyaml>=6,<7",
]

[project.scripts]
dev = "revold_tooling.cli:main"

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revold_tooling"]
