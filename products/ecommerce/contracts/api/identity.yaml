openapi: 3.0.3
info:
  title: Core Identity API
  version: "1.0.0"
  description: >
    Contrato do core-identity (Contract-First, ver ADR-0002). Autenticação é
    sempre federada — nunca há senha local (ADR-0003) — e a sessão do
    usuário autenticado é mantida no servidor (Redis) e referenciada por um
    cookie HttpOnly no navegador, nunca por um token no corpo/localStorage
    (ADR-0010).
servers:
  - url: /api/auth
paths:
  /login/start:
    post:
      operationId: startLogin
      summary: Gera a URL de autorização do provedor federado configurado
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartLoginRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginChallenge" }

  /login/complete:
    post:
      operationId: completeLogin
      summary: >
        Troca code+state pelo usuário autenticado e abre uma sessão
        (Set-Cookie: session_id, HttpOnly)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompleteLoginRequest" }
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthenticatedUser" }

  /logout:
    post:
      operationId: logout
      summary: Encerra a sessão atual (apaga no Redis e limpa o cookie)
      responses:
        "204":
          description: Sessão encerrada

  /me:
    get:
      operationId: getCurrentUser
      summary: Retorna o usuário autenticado da sessão atual
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthenticatedUser" }
        "401":
          description: Sem sessão válida (cookie ausente, inválido ou expirado)

  /api-keys:
    post:
      operationId: issueApiKey
      summary: >
        Emite uma API key para um parceiro/integração (ADR-0016) — uso
        administrativo, papel ADMIN (mais restrito que os endpoints de
        catálogo/estoque, que também aceitam STAFF). `raw_key` só aparece
        nesta resposta — perdida a partir daqui, só dá pra revogar e emitir
        outra.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueApiKeyRequest" }
      responses:
        "201":
          description: Chave emitida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuedApiKey" }
        "401":
          description: Sem sessão válida
        "403":
          description: Papel ADMIN exigido
  /api-keys/{key_id}:
    delete:
      operationId: revokeApiKey
      summary: Revoga uma API key existente — uso administrativo, papel ADMIN
      security:
        - sessionCookie: []
      parameters:
        - name: key_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Revogada
        "401":
          description: Sem sessão válida
        "403":
          description: Papel ADMIN exigido
        "404":
          description: API key não encontrada

components:
  schemas:
    StartLoginRequest:
      type: object
      required: [redirect_uri]
      properties:
        redirect_uri: { type: string }
    LoginChallenge:
      type: object
      required: [authorize_url, state]
      properties:
        authorize_url: { type: string }
        state: { type: string }
    CompleteLoginRequest:
      type: object
      required: [code, state]
      properties:
        code: { type: string }
        state: { type: string }
    AuthenticatedUser:
      type: object
      required: [external_id, provider, email, name, roles]
      properties:
        external_id: { type: string }
        provider: { type: string }
        email: { type: string }
        name: { type: string }
        roles:
          type: array
          items: { type: string, enum: [customer, staff, admin] }
    IssueApiKeyRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, description: "Nome do parceiro/integração dono da chave" }
    IssuedApiKey:
      type: object
      required: [key_id, name, raw_key]
      properties:
        key_id: { type: string }
        name: { type: string }
        raw_key:
          type: string
          description: >
            Chave em texto puro — só aparece nesta resposta, nunca é
            possível recuperá-la de novo depois (ver ADR-0016).
