openapi: 3.0.3
info:
  title: Core Cart API
  version: "1.0.0"
  description: >
    Contrato do core-cart (Contract-First, ver ADR-0002). O carrinho é
    identificado por um cart_id opaco (gerado pelo frontend e guardado em
    cookie/localStorage) — não exige login (core-identity é usado só para
    ligar o carrinho a um usuário autenticado quando ele logar, o que ainda
    não está implementado nesta versão).
servers:
  - url: /api/cart
paths:
  /{cart_id}:
    get:
      operationId: getCart
      parameters:
        - name: cart_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
    delete:
      operationId: clearCart
      parameters:
        - name: cart_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Carrinho esvaziado }

  /{cart_id}/items:
    post:
      operationId: addItem
      parameters:
        - name: cart_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddItemRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }

  /{cart_id}/items/{sku}:
    patch:
      operationId: updateItemQuantity
      parameters:
        - name: cart_id
          in: path
          required: true
          schema: { type: string }
        - name: sku
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateQuantityRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
    delete:
      operationId: removeItem
      parameters:
        - name: cart_id
          in: path
          required: true
          schema: { type: string }
        - name: sku
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }

  /{cart_id}/checkout:
    post:
      operationId: startCheckout
      summary: Gera o link de handoff de checkout (ADR-0005)
      parameters:
        - name: cart_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutHandoffResponse" }
        "422":
          description: Carrinho vazio ou canal de checkout não configurado

components:
  schemas:
    CartItem:
      type: object
      required: [sku, name, variant_label, unit_price, quantity]
      properties:
        sku: { type: string }
        name: { type: string }
        variant_label: { type: string, example: "M / Azul" }
        unit_price: { type: string, description: "decimal como string" }
        quantity: { type: integer, minimum: 1 }
        available_quantity:
          type: integer
          nullable: true
          minimum: 0
          description: >
            Quantidade disponível em core-inventory no momento da consulta,
            ou null se o SKU ainda não tem estoque cadastrado. Informativo
            apenas — não bloqueia adicionar ao carrinho; a reserva de
            verdade só acontece no checkout (ver POST /{cart_id}/checkout).
    Cart:
      type: object
      required: [cart_id, items, total, currency]
      properties:
        cart_id: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/CartItem" }
        total: { type: string }
        currency: { type: string, default: BRL }
    AddItemRequest:
      type: object
      required: [sku, name, variant_label, unit_price, quantity]
      properties:
        sku: { type: string }
        name: { type: string }
        variant_label: { type: string }
        unit_price: { type: string }
        quantity: { type: integer, minimum: 1, default: 1 }
    UpdateQuantityRequest:
      type: object
      required: [quantity]
      properties:
        quantity: { type: integer, minimum: 1 }
    CheckoutHandoffResponse:
      type: object
      required: [handoff_url, provider]
      properties:
        handoff_url: { type: string, format: uri }
        provider: { type: string, example: whatsapp-clicktochat }
