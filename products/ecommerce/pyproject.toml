[project]
name = "revold-ecommerce"
version = "0.1.0"
description = "Produto de e-commerce: o que cruza os domínios da loja."
requires-python = ">=3.12"
# Dependencias internas sem pino: o uv.lock unico e o workspace resolvem a versao.
dependencies = [
    "revold-ai-assistant",
    "revold-catalog",
    "revold-identity",
    "revold-inventory",
    "revold-notification",
    "revold-orders",
    "revold-payments",
    "revold-store-settings",
    "revold-platform",
    "revold-postgres",
]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revold_ecommerce"]
