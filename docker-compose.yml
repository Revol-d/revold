services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: revold
      POSTGRES_PASSWORD: revold_dev_only
      POSTGRES_DB: revold
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revold"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
      target: dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://revold:revold_dev_only@postgres:5432/revold
      DATABASE_URL_SYNC: postgresql+psycopg2://revold:revold_dev_only@postgres:5432/revold
      REDIS_URL: redis://redis:6379/0
      AUTH_PROVIDER: dev
      CHECKOUT_PROVIDER: whatsapp-clicktochat
      EVENT_PUBLISHER: celery
      NOTIFICATION_PROVIDER: logging
      MEDIA_STORAGE_PROVIDER: local
      MEDIA_STORAGE_LOCAL_DIR: /app/media
      MEDIA_STORAGE_LOCAL_BASE_URL: http://localhost:8000/media
      PUBLIC_API_RATE_LIMIT: "60"
      PUBLIC_API_RATE_LIMIT_WINDOW_SECONDS: "60"
    volumes:
      - ./cores:/app/cores
      - ./adapters:/app/adapters
      - ./workers:/app/workers
      - ./apps/api-gateway:/app/apps/api-gateway
      - ./alembic.ini:/app/alembic.ini
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    # Consome os eventos publicados por adapters_messaging.events.CeleryEventPublisher
    # (ADR-0013) — reindexação incremental do índice de IA, notificação
    # assíncrona de checkout/estoque baixo. Reaproveita a mesma imagem do
    # api-gateway (mesmas dependências Python já instaladas — celery,
    # cores, adapters), só troca o comando.
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
      target: dev
    restart: unless-stopped
    command: ["poetry", "run", "celery", "-A", "event_worker.celery_app", "worker", "--loglevel=info"]
    environment:
      DATABASE_URL: postgresql+asyncpg://revold:revold_dev_only@postgres:5432/revold
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: dev
      NOTIFICATION_PROVIDER: logging
      WEBHOOK_SENDER_PROVIDER: logging
      WEBHOOK_URLS: ""
    volumes:
      - ./cores:/app/cores
      - ./adapters:/app/adapters
      - ./workers:/app/workers
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
      target: dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # NEXT_PUBLIC_... é lido pelo navegador do usuário (fora do Docker,
      # por isso localhost:8000 via port mapping). API_GATEWAY_INTERNAL_URL
      # é lido pelo servidor do Next.js dentro deste container, que precisa
      # do nome do serviço na rede do Compose (ver comentário em
      # apps/storefront/lib/api.ts).
      NEXT_PUBLIC_API_GATEWAY_URL: http://localhost:8000
      API_GATEWAY_INTERNAL_URL: http://api-gateway:8000
    volumes:
      - ./apps/storefront:/repo/apps/storefront
      - ./packages:/repo/packages
      - /repo/apps/storefront/node_modules
      - /repo/apps/storefront/.next
    depends_on:
      api-gateway:
        condition: service_healthy

  prometheus:
    # Faz scrape de /metrics do api-gateway (ADR-0017) — self-hosted, zero
    # credencial nenhuma, mesma categoria de infra que Postgres/Redis.
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api-gateway:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      # Só dev local — sem tela de configuração inicial nem senha
      # persistida em segredo nenhum lugar.
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  admin-dashboard:
    build:
      context: .
      dockerfile: apps/admin-dashboard/Dockerfile
      target: dev
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_API_GATEWAY_URL: http://localhost:8000
    volumes:
      - ./apps/admin-dashboard:/repo/apps/admin-dashboard
      - ./packages:/repo/packages
      - /repo/apps/admin-dashboard/node_modules
      - /repo/apps/admin-dashboard/.next
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
  prometheus_data:
  grafana_data:
