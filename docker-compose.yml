services:
  mssql:
    # Imagem própria (deploy/docker/mssql/): a oficial não tem Full-Text Search
    # instalado nem cria o banco `revold` sozinha, e precisa do motor 2025 (não
    # 2022) para o tipo nativo VECTOR -- ver o Dockerfile para os achados reais e
    # como foram verificados.
    build:
      context: deploy/docker/mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: revold_dev_only_1
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      # Confere o banco `revold`, nao so "SELECT 1" -- o entrypoint aceita conexao
      # ANTES de terminar de criar o banco (achado real: SELECT 1 passava com o
      # banco ainda nao existindo, corrida entre o sqlservr aceitar conexao e o
      # entrypoint rodar o CREATE DATABASE).
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $$MSSQL_SA_PASSWORD -Q \"SELECT 1 FROM sys.databases WHERE name = 'revold'\" | grep -q '(1 rows affected)' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-gateway:
    build:
      context: .
      dockerfile: apps/ecommerce/api-gateway/Dockerfile
      target: dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    # env_file carrega tudo que o .env (copiado de .env.example, ver
    # "Preparar a máquina" do CONTRIBUTING.md) configura e que NÃO
    # está hardcoded em `environment:` abaixo — NICK_WHATSAPP_NUMBER,
    # SESSION_COOKIE_SECURE, SMTP_*, AZURE_*, GOOGLE_*, WEBHOOK_URLS,
    # PAYMENT_PROVIDER/MERCADO_PAGO_*, WHATSAPP_BUSINESS_* etc.
    # Sem isso, nenhuma dessas variáveis chegava ao container (achado ao
    # implementar o primeiro teste E2E via browser real, ADR-0020: sem
    # NICK_WHATSAPP_NUMBER, todo checkout falhava; com o cookie de sessão
    # Secure=true — o padrão — e sem HTTPS, o navegador nem guardava o
    # cookie, quebrando login pelo storefront/admin-dashboard reais).
    # `environment:` abaixo continua tendo prioridade sobre o `.env` para
    # as mesmas chaves (Compose aplica env_file primeiro, depois
    # environment) — por isso NOTIFICATION_PROVIDER não está mais fixado
    # aqui embaixo (ver ADR-0025): estava hardcoded em "logging", o que
    # calava silenciosamente qualquer `NOTIFICATION_PROVIDER=smtp` ou
    # `=whatsapp-business` posto no `.env` — ninguém tinha percebido
    # porque SMTP (ADR-0018) nunca tinha sido testado via `make dev` de
    # verdade. PAYMENT_PROVIDER (ADR-0024) e CHECKOUT_PROVIDER continuam
    # fixos abaixo de propósito (nenhum dos dois tem alternativa real
    # ainda ativada por padrão fora de dev).
    env_file:
      - .env
    environment:
      DATABASE_URL: mssql+aioodbc://sa:revold_dev_only_1@mssql:1433/revold?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
      DATABASE_URL_SYNC: mssql+pyodbc://sa:revold_dev_only_1@mssql:1433/revold?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
      REDIS_URL: redis://redis:6379/0
      AUTH_PROVIDER: dev
      CHECKOUT_PROVIDER: whatsapp-clicktochat
      EVENT_PUBLISHER: celery
      MEDIA_STORAGE_PROVIDER: local
      MEDIA_STORAGE_LOCAL_DIR: /app/media
      MEDIA_STORAGE_LOCAL_BASE_URL: http://localhost:8000/media
      PUBLIC_API_RATE_LIMIT: "60"
      PUBLIC_API_RATE_LIMIT_WINDOW_SECONDS: "60"
    # O código das unidades é montado por cima do que a imagem copiou: as unidades estão
    # instaladas em modo editável (workspace uv), então o reload do Uvicorn enxerga a edição
    # sem rebuild. O ambiente Python fica em /opt/venv, fora de /app, e não é escondido.
    volumes:
      - ./libs:/app/libs
      - ./products:/app/products
      - ./apps/ecommerce/api-gateway:/app/apps/ecommerce/api-gateway
      - ./tests:/app/tests
      - ./tooling:/app/tooling
      - ./alembic.ini:/app/alembic.ini
      - media_data:/app/media
    depends_on:
      mssql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    # Consome os eventos publicados por revold_messaging.celery_publisher.CeleryEventPublisher
    # (ADR-0013) — reindexação incremental do índice de IA, notificação
    # assíncrona de checkout/estoque baixo. Tem a própria imagem
    # (apps/ecommerce/event-worker), com só o fecho que o unit.yaml dele declara.
    build:
      context: .
      dockerfile: apps/ecommerce/event-worker/Dockerfile
      target: dev
    restart: unless-stopped
    # Mesmo racional do api-gateway acima: SMTP_*/NICK_NOTIFICATION_EMAIL
    # (canal de e-mail, ADR-0018) e WHATSAPP_BUSINESS_*/NICK_WHATSAPP_NUMBER
    # (ADR-0025) só chegam aqui via .env — é este serviço, não o
    # api-gateway, que de fato despacha as notificações (ver
    # apps/ecommerce/event-worker/src/event_worker/celery_app.py). Mesma correção
    # do api-gateway acima: NOTIFICATION_PROVIDER não fica mais hardcoded
    # aqui, senão o `.env` nunca teria efeito.
    env_file:
      - .env
    environment:
      DATABASE_URL: mssql+aioodbc://sa:revold_dev_only_1@mssql:1433/revold?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: dev
      WEBHOOK_SENDER_PROVIDER: logging
      WEBHOOK_URLS: ""
    volumes:
      - ./libs:/app/libs
      - ./products:/app/products
      - ./apps/ecommerce/event-worker:/app/apps/ecommerce/event-worker
    depends_on:
      mssql:
        condition: service_healthy
      redis:
        condition: service_healthy

  storefront:
    build:
      context: .
      dockerfile: apps/ecommerce/storefront/Dockerfile
      target: dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # NEXT_PUBLIC_... é lido pelo navegador do usuário (fora do Docker,
      # por isso localhost:8000 via port mapping). API_GATEWAY_INTERNAL_URL
      # é lido pelo servidor do Next.js dentro deste container, que precisa
      # do nome do serviço na rede do Compose (ver comentário em
      # apps/ecommerce/storefront/lib/api.ts).
      NEXT_PUBLIC_API_GATEWAY_URL: http://localhost:8000
      API_GATEWAY_INTERNAL_URL: http://api-gateway:8000
    volumes:
      - ./apps/ecommerce/storefront:/repo/apps/ecommerce/storefront
      - ./libs/web:/repo/libs/web
      - /repo/apps/ecommerce/storefront/node_modules
      - /repo/apps/ecommerce/storefront/.next
      - /repo/libs/web/ui/node_modules
    depends_on:
      api-gateway:
        condition: service_healthy

  prometheus:
    # Faz scrape de /metrics do api-gateway (ADR-0017) — self-hosted, zero
    # credencial nenhuma, mesma categoria de infra que o Azure SQL/Redis.
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api-gateway:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      # Só dev local — sem tela de configuração inicial nem senha
      # persistida em segredo nenhum lugar.
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      # Datasource Prometheus + dashboard "Revold — Visão Geral" (ADR-0017)
      # provisionados como código — já aparecem no primeiro load, sem
      # configuração manual.
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  admin-dashboard:
    build:
      context: .
      dockerfile: apps/ecommerce/admin-dashboard/Dockerfile
      target: dev
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_API_GATEWAY_URL: http://localhost:8000
    volumes:
      - ./apps/ecommerce/admin-dashboard:/repo/apps/ecommerce/admin-dashboard
      - ./libs/web:/repo/libs/web
      - /repo/apps/ecommerce/admin-dashboard/node_modules
      - /repo/apps/ecommerce/admin-dashboard/.next
      - /repo/libs/web/ui/node_modules
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  mssql_data:
  media_data:
  prometheus_data:
  grafana_data:
