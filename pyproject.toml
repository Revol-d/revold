# Raiz do workspace uv do monorepo revold.
# NAO e um pacote publicavel: so orquestra os membros (apps/, libs/, products/, tooling/).
#
# Cada membro tem seu proprio pyproject.toml e sua PROPRIA versao. O versionamento e
# INDEPENDENTE por unidade (nunca lockstep): ver docs/versionamento-e-deploy.md e a ADR-0029.

[tool.uv.workspace]
members = [
    # App entra pelo caminho, nao por `apps/*`: o uv exige pyproject em toda pasta que o glob
    # casa, e `apps/<produto>/` e os sites (pnpm) nao tem. O `dev new app` acrescenta.
    "apps/ecommerce/api-gateway",
    "apps/ecommerce/event-worker",
    "apps/ecommerce/catalog-indexer",
    "libs/platform",
    "libs/integrations/*",
    "libs/domains/*",
    "products/*",
    "tooling",
]

# Os pacotes revold-* NUNCA devem ser resolvidos do PyPI publico: se alguem registrar um
# homonimo la, um `uv sync` sem isto baixaria o pacote de terceiro (dependency confusion).
# Cada dependencia interna resolve do proprio workspace.
[tool.uv.sources]
revold-tooling = { workspace = true }
revold-platform = { workspace = true }
revold-azure-sql = { workspace = true }
revold-redis = { workspace = true }
revold-messaging = { workspace = true }
revold-prometheus = { workspace = true }
revold-smtp = { workspace = true }
revold-whatsapp = { workspace = true }
revold-mercado-pago = { workspace = true }
revold-openai = { workspace = true }
revold-azure-blob = { workspace = true }
revold-ai-assistant = { workspace = true }
revold-cart = { workspace = true }
revold-catalog = { workspace = true }
revold-communication = { workspace = true }
revold-identity = { workspace = true }
revold-inventory = { workspace = true }
revold-notification = { workspace = true }
revold-orders = { workspace = true }
revold-payments = { workspace = true }
revold-store-settings = { workspace = true }
revold-ecommerce = { workspace = true }

# Um grupo so, e o padrao do uv: `uv sync` sem argumento ja instala tudo o que os gates e os
# testes usam. Em FAIXA, como o resto do monorepo: o que trava a versao e o uv.lock.
[dependency-groups]
dev = [
    "pytest>=8.3.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=5,<6",
    # ruff e mypy sao GATE: por isso moram aqui, e nao num `--with` solto no hook e outro no CI.
    # O uv.lock passa a ser o pin, unico para os dois.
    "ruff>=0.6.8,<0.7",
    "mypy>=1.11.2,<2",
    "types-PyYAML>=6,<7",
    "types-jsonschema>=4.21,<5",
    "fakeredis>=2.24.1,<3",
    "factory-boy>=3.3.1,<4",
    "faker>=30.3,<31",
    "respx>=0.21.1,<0.22",
    "aiosmtpd>=1.4.6,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests", "apps", "libs", "products", "tooling"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
# Fora de unidade, mas importavel pelos testes: as fabricas de dados compartilhadas (ADR-0012),
# o pacote de apoio dos evals do assistente e os construtores dos testes do tooling.
pythonpath = ["tests/support", "libs/domains/ai-assistant/evals", "tooling/tests"]
markers = [
  "integration: exercita infraestrutura real (Postgres, Redis) em vez de fake em memória — pula sozinho se a infra não estiver acessível (ver libs/domains/catalog/tests/test_catalog_repository_integration.py)",
  "contract: confere a API contra os contratos em products/ecommerce/contracts/api/*.yaml (hoje: a lista de rotas, nao os campos)",
  "eval: dataset comportamental do assistente de IA (libs/domains/ai-assistant/evals) — parte roda sempre (checagem determinística contra o LLMProvider configurado), parte (LLM-as-judge) só roda de verdade com LLM_PROVIDER=azure-openai e credencial real; pula sozinho caso contrário",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tooling/templates"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = "(^|/)(tests|evals)/"
