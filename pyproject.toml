[tool.poetry]
name = "revold"
version = "0.1.0"
description = "Monorepo da plataforma de desenvolvimento de software da empresa — piloto: e-commerce da Nick"
authors = ["Samuel <samuel.ss913@gmail.com>"]
package-mode = true
packages = [
  { include = "core_catalog", from = "cores/core-catalog/src" },
  { include = "core_identity", from = "cores/core-identity/src" },
  { include = "core_cart", from = "cores/core-cart/src" },
  { include = "core_inventory", from = "cores/core-inventory/src" },
  { include = "core_communication", from = "cores/core-communication/src" },
  { include = "core_ai_assistant", from = "cores/core-ai-assistant/src" },
  { include = "core_notification", from = "cores/core-notification/src" },
  { include = "adapters_persistence", from = "adapters/persistence/src" },
  { include = "adapters_external", from = "adapters/external/src" },
  { include = "adapters_messaging", from = "adapters/messaging/src" },
  { include = "api_gateway", from = "apps/api-gateway/src" },
]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
sqlalchemy = "^2.0.35"
alembic = "^1.13.3"
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.9"
celery = "^5.4.0"
redis = "^5.0.8"
uvicorn = {extras = ["standard"], version = "^0.30.6"}
httpx = "^0.27.2"
msal = "^1.31.0"
langchain = "^0.3.0"
langgraph = "^0.2.0"
langchain-openai = "^0.2.0"
pgvector = "^0.3.5"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
ruff = "^0.6.8"
mypy = "^1.11.2"
httpx = "^0.27.2"
fakeredis = "^2.24.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["cores", "adapters", "apps"]
asyncio_mode = "auto"
# --import-mode=importlib: permite que módulos de teste com o mesmo nome de
# arquivo (ex.: test_use_cases.py em mais de um core) coexistam sem colidir
# em sys.modules — inevitável num monorepo com muitos cores/adapters, cada
# um com sua própria pasta tests/ (ver docs/guides/development.md).
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# Pastas de teste não entram no mypy da raiz: cada core/adapter tem sua
# própria pasta tests/ sem __init__.py (ver addopts acima), o que faz o
# mypy reclamar de "Duplicate module" quando roda sobre o repo inteiro.
# ruff + a própria execução dos testes já cobrem a qualidade desses arquivos.
exclude = "(^|/)tests/"
