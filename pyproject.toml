[tool.poetry]
name = "revold"
version = "0.1.0"
description = "Monorepo da plataforma de desenvolvimento de software da empresa — piloto: e-commerce da Nick"
authors = ["Samuel <samuel.ss913@gmail.com>"]
package-mode = true
packages = [
  { include = "core_catalog", from = "cores/core-catalog/src" },
  { include = "core_identity", from = "cores/core-identity/src" },
  { include = "core_cart", from = "cores/core-cart/src" },
  { include = "core_inventory", from = "cores/core-inventory/src" },
  { include = "core_communication", from = "cores/core-communication/src" },
  { include = "core_ai_assistant", from = "cores/core-ai-assistant/src" },
  { include = "core_notification", from = "cores/core-notification/src" },
  { include = "core_events", from = "cores/core-events/src" },
  { include = "core_observability", from = "cores/core-observability/src" },
  { include = "core_store_settings", from = "cores/core-store-settings/src" },
  { include = "adapters_persistence", from = "adapters/persistence/src" },
  { include = "adapters_external", from = "adapters/external/src" },
  { include = "adapters_messaging", from = "adapters/messaging/src" },
  { include = "api_gateway", from = "apps/api-gateway/src" },
  { include = "catalog_indexer", from = "workers/catalog-indexer/src" },
  { include = "event_worker", from = "workers/event-worker/src" },
  { include = "revold_testing", from = "tools/testing/src" },
  { include = "core_ai_assistant_evals", from = "cores/core-ai-assistant/evals" },
]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
sqlalchemy = "^2.0.35"
alembic = "^1.13.3"
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.9"
celery = "^5.4.0"
redis = "^5.0.8"
uvicorn = {extras = ["standard"], version = "^0.30.6"}
httpx = "^0.27.2"
msal = "^1.31.0"
langchain = "^0.3.0"
langgraph = "^0.2.0"
langchain-openai = "^0.2.0"
pgvector = "^0.3.5"
azure-storage-blob = "^12.23.0"
aiohttp = "^3.14.3"
python-multipart = "^0.0.32"
prometheus-client = "^0.26.0"
aiosmtplib = "^5.1.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
ruff = "^0.6.8"
mypy = "^1.11.2"
httpx = "^0.27.2"
fakeredis = "^2.24.1"
factory-boy = "^3.3.1"
faker = "^30.3.0"
respx = "^0.21.1"
aiosmtpd = "^1.4.6"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["cores", "adapters", "apps", "workers"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
markers = [
  "integration: exercita infraestrutura real (Postgres, Redis) em vez de fake em memória — pula sozinho se a infra não estiver acessível (ver adapters/persistence/tests/test_catalog_repository_integration.py)",
  "contract: valida requests/responses HTTP contra o schema declarado em contracts/api/*.yaml",
  "eval: dataset comportamental do assistente de IA (core-ai-assistant) — parte roda sempre (checagem determinística contra o LLMProvider configurado), parte (LLM-as-judge) só roda de verdade com LLM_PROVIDER=azure-openai e credencial real; pula sozinho caso contrário",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = "(^|/)tests/"
