name: CI

# Trunk-based (ADR-0028): a `main` e a unica branch protegida e todo PR vai direto para ela.
# O draft PR e a pista livre: quem quer ver o CI rodar sem pedir revisao abre o PR em draft.
on:
  # So `pull_request`. Ter tambem `push` na `main` faria o CI rodar DUAS VEZES sobre o mesmo
  # codigo: o evento `pull_request` ja roda sobre o RESULTADO do merge, nao sobre a branch de
  # origem sozinha. O commit que entra na `main` ja foi validado antes de existir.
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancela a rodada anterior quando chega commit novo na mesma ref. Num PR em draft, onde se
# empurra varias vezes seguidas, isso e a diferenca entre uma fila de rodadas obsoletas e o
# resultado do que esta la agora.
concurrency:
  # `head_ref || ref`: em PR, agrupa pela branch de ORIGEM; fora de PR, pela ref. Com
  # `github.ref` sozinho, empurrar de novo numa branch com PR aberto NAO cancelava a
  # rodada anterior, porque a ref de um PR e `refs/pull/N/merge` e muda a cada push.
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Menor privilegio: nenhum job deste workflow escreve nada no repositorio.
permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Instalar o workspace
        run: uv sync --frozen
      - name: ruff - lint
        # A versao vem do grupo `dev` do pyproject.toml, pinada pelo uv.lock: a mesma do hook.
        run: uv run ruff check .

  hooks:
    # Os MESMOS hooks de commit do .pre-commit-config.yaml, em todos os arquivos. Ninguem e
    # obrigado a instalar os hooks na maquina (o Git nao deixa o projeto instalar sozinho), e o
    # que so o hook conferia (YAML/JSON/TOML quebrado, marcador de conflito, arquivo grande,
    # espaco no fim da linha, CRLF) chegava na main sem ninguem ver. Caso real: o orders.yaml
    # ficou invalido desde que nasceu, e o CI nunca percebeu.
    #
    # SKIP: o ruff e o dev check ja tem job proprio (`lint` e `architecture`); o bloqueio de
    # commit na main, no servidor, e do ruleset.
    name: Hooks do pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Os hooks de commit, em todos os arquivos
        env:
          SKIP: ruff-check,dev-check,no-commit-to-protected-branch
        # A versao do pre-commit fica fixa aqui pelo mesmo motivo das outras ferramentas de gate:
        # versao nova nao pode reprovar PR sem ninguem ter mexido em codigo.
        run: uvx pre-commit@4.6.2 run --all-files --show-diff-on-failure

  architecture:
    name: Manifesto, fronteiras e tipos (dev check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Instalar o workspace
        run: uv sync --frozen
      - name: Manifesto, gerados em dia, versoes, import-linter e mypy
        # O `.importlinter` e o CODEOWNERS sao GERADOS dos unit.yaml (`uv run dev gen`), nunca
        # editados a mao. O `dev check` reprova quando o commitado diverge do gerado, valida o
        # manifesto, confere as versoes contra o ultimo release, roda o import-linter e o mypy.
        #
        # E o MESMO comando do hook `mypy` do pre-push (.pre-commit-config.yaml). O mypy e GATE:
        # o codigo esta em zero erros, e erro de tipo reprova a build.
        env:
          PYTHONIOENCODING: utf-8
        run: uv run dev check

  affected:
    # Quais unidades a branch toca, mais os consumidores delas (fecho reverso). Mudanca so em
    # docs/ nao afeta nenhuma, e os testes de unidade nao rodam.
    name: Unidades afetadas
    runs-on: ubuntu-latest
    outputs:
      units: ${{ steps.calc.outputs.units }}
      any: ${{ steps.calc.outputs.any }}
      python: ${{ steps.calc.outputs.python }}
      web: ${{ steps.calc.outputs.web }}
      e2e: ${{ steps.calc.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Historico inteiro: o calculo compara a branch com o ponto em que ela saiu da base.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Instalar o workspace
        run: uv sync --frozen
      - name: Calcular
        id: calc
        run: |
          base="origin/${{ github.base_ref || 'main' }}"
          json="$(uv run dev affected --base "$base" --json)"
          echo "$json"
          echo "units=$(echo "$json" | jq -c .units)" >> "$GITHUB_OUTPUT"
          echo "any=$(echo "$json" | jq -r .any)" >> "$GITHUB_OUTPUT"
          echo "python=$(echo "$json" | jq -r .python)" >> "$GITHUB_OUTPUT"
          echo "web=$(echo "$json" | jq -r .web)" >> "$GITHUB_OUTPUT"
          # E2E: a loja ou a API (ou qualquer unidade do fecho delas) foi afetada.
          echo "e2e=$(echo "$json" | jq -r 'any(.units[]; . == "storefront" or . == "api-gateway")')" >> "$GITHUB_OUTPUT"

  tests:
    # So as unidades Python AFETADAS (job `affected`) e os consumidores delas. Se o PR nao toca
    # nenhuma (so docs/, ou so um site), o job e pulado, e o `ci-ok` aceita esse skip.
    name: Testes (Python)
    runs-on: ubuntu-latest
    needs: [affected]
    if: needs.affected.outputs.python == 'true'
    # Postgres de verdade, nao so o fake em memoria: os testes marcados `integration` pulam
    # (skip) sozinhos se DATABASE_URL nao apontar para um Postgres alcancavel. Sem este service
    # eles nunca rodariam no CI, e a suite "verde" esconderia isso. pgvector/pgvector (nao a
    # imagem postgres oficial) porque a migracao 0003 cria a extensao vector, usada pelo
    # dominio ai-assistant.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: revold
          POSTGRES_PASSWORD: revold_ci_only
          POSTGRES_DB: revold
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://revold:revold_ci_only@localhost:5432/revold
      DATABASE_URL_SYNC: postgresql+psycopg2://revold:revold_ci_only@localhost:5432/revold
      TEST_DATABASE_URL: postgresql+asyncpg://revold:revold_ci_only@localhost:5432/revold
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Instalar o workspace
        run: uv sync --frozen
      - name: Migracoes (no Postgres do service acima)
        run: uv run alembic upgrade head
      - name: Testes das unidades afetadas
        # `dev test --affected` roda os testes das unidades afetadas e, quando a mudanca e
        # global (uv.lock, tooling, tests/), a suite central junto.
        run: uv run dev test --affected --base "origin/${{ github.base_ref || 'main' }}" -q

  tests-azure-sql:
    # Fase 5 do plano de migracao Postgres -> Azure SQL (docs internos). Mesmo espirito
    # do job `tests` acima (service container real, nao so skip): os 7 dominios que
    # dependem de persistencia ja tem adapter Azure SQL (Fases 1 e 2 do plano).
    #
    # Esta no `needs` do `ci-ok` e o `result` dele e conferido la (as duas armadilhas do
    # `ci-ok` pedem isso -- ver o comentario la, e tests/architecture/test_ci_workflow.py
    # que reprova se algum job ficar de fora). Mas DE PROPOSITO nao faz o `ci-ok` falhar
    # ainda: so avisa (`::warning::`). Fica assim ate o health-check deste service
    # container (novo, mais lento pra subir que o Postgres) provar estavel por um numero
    # de PRs seguidos -- so entao o `case` no `ci-ok` passa a somar pra `falhou`, igual
    # `tests`/`images` ja fazem.
    name: Testes (Python, Azure SQL)
    runs-on: ubuntu-latest
    needs: [affected]
    if: needs.affected.outputs.python == 'true'
    env:
      PERSISTENCE_PROVIDER: azure-sql
      DATABASE_URL: mssql+aioodbc://sa:Rev0ld_ci_only_1@localhost:1433/revold?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
      DATABASE_URL_SYNC_AZURE_SQL: mssql+pyodbc://sa:Rev0ld_ci_only_1@localhost:1433/revold?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
      TEST_DATABASE_URL_AZURE_SQL: mssql+aioodbc://sa:Rev0ld_ci_only_1@localhost:1433/revold?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Instalar o ODBC Driver 18 for SQL Server
        # O runner ubuntu-latest nao vem com o driver (conferido no proprio
        # actions/runner-images) -- e script oficial da Microsoft, que le a versao do
        # Ubuntu em /etc/os-release em vez de fixar uma, porque o ubuntu-latest muda de
        # versao com o tempo (estava mudando para a 26.04 nesta mesma epoca).
        run: |
          ubuntu_version=$(grep VERSION_ID /etc/os-release | cut -d '"' -f 2)
          curl -fsSLO "https://packages.microsoft.com/config/ubuntu/$ubuntu_version/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          rm packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 mssql-tools18 unixodbc-dev
          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"
      - name: Instalar o workspace
        run: uv sync --frozen
      - name: Montar a imagem do SQL Server com Full-Text Search
        # A imagem oficial mcr.microsoft.com/mssql/server:2022-latest NAO vem com
        # Full-Text Search instalado -- confirmado rodando este job de verdade: a
        # migracao do catalog (CREATE FULLTEXT CATALOG) falhava com "Full-Text Search
        # is not installed" (erro 7609). Nao da pra instalar via `docker exec` num
        # container ja rodando (nao pega -- so funciona se instalado ANTES do primeiro
        # start do sqlservr, confirmado contra relatos reais de quem tentou as duas
        # formas). Por isso este job nao usa mais `services:` (que so aceita puxar uma
        # imagem pronta): builda a imagem com o pacote aqui, antes de subir o
        # container.
        run: |
          cat <<'DOCKERFILE' > Dockerfile.mssql-fts
          FROM mcr.microsoft.com/mssql/server:2022-latest
          USER root
          # O repositorio "prod" ja configurado na imagem so tem as ferramentas
          # cliente (mssql-tools18 etc) -- mssql-server-fts mora no repositorio
          # especifico do produto (mssql-server-2022), que precisa ser adicionado a
          # mao. Confirmado rodando isto de verdade num container local antes de por
          # no CI: sem este repositorio, "apt-get install mssql-server-fts" da
          # "Unable to locate package"; com ele, instala e
          # FULLTEXTSERVICEPROPERTY('IsFullTextInstalled') volta 1.
          RUN apt-get update \
              && apt-get install -y curl \
              && curl -fsSL https://packages.microsoft.com/config/ubuntu/22.04/mssql-server-2022.list -o /etc/apt/sources.list.d/mssql-server-2022.list \
              && apt-get update \
              && ACCEPT_EULA=Y apt-get install -y mssql-server-fts \
              && apt-get clean \
              && rm -rf /var/lib/apt/lists/*
          USER mssql
          DOCKERFILE
          docker build -t revold-mssql-fts-ci:local -f Dockerfile.mssql-fts .
      - name: Subir o SQL Server (com Full-Text Search)
        run: |
          docker run -d --name mssql \
            -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD=Rev0ld_ci_only_1 \
            -p 1433:1433 \
            revold-mssql-fts-ci:local
      - name: Esperar o SQL Server responder
        # sqlcmd roda DENTRO do container -- o SQL Server demora mais pra ficar pronto
        # que o Postgres, por isso o retry generoso.
        run: |
          for i in $(seq 1 30); do
            if docker exec mssql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Rev0ld_ci_only_1 -Q 'SELECT 1' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::SQL Server nao respondeu a tempo."
          docker logs mssql
          exit 1
      - name: Criar o banco (a imagem so cria o master)
        run: sqlcmd -C -S localhost -U sa -P Rev0ld_ci_only_1 -Q "CREATE DATABASE revold"
      - name: Migracoes (no Azure SQL do container acima)
        run: uv run alembic -c alembic-azure-sql.ini upgrade head
      - name: Testes das unidades afetadas
        run: uv run dev test --affected --base "origin/${{ github.base_ref || 'main' }}" -q
      - name: Derrubar o SQL Server
        if: always()
        run: docker rm -f mssql || true

  frontend:
    # O workspace pnpm: a lib `@revold/ui` e os dois sites. Roda so quando alguma unidade
    # TypeScript foi afetada (`web` do job `affected`).
    name: Frontend (pnpm lint e build)
    runs-on: ubuntu-latest
    needs: [affected]
    if: needs.affected.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v4
      # A versao do pnpm vem do `packageManager` do package.json da raiz.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - name: Instalar o workspace
        run: pnpm install --frozen-lockfile
      # `pnpm lint` e `pnpm build` (os scripts da raiz), e nao `pnpm -r lint`: com `-r` na
      # linha de comando o pnpm inclui o pacote da raiz, cujo script chama `pnpm -r` de novo, e
      # cada pacote roda DUAS vezes em paralelo sobre a mesma pasta `.next`.
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build

  site-images:
    # A imagem Docker dos dois sites. O job `frontend` prova que o site compila; este prova que o
    # Dockerfile ainda monta (caminhos do COPY, workspace pnpm, lock congelado). O mesmo Dockerfile
    # e o que o `make dev` usa: quebrado, ninguem consegue subir a pilha. O release e a tag dos sites
    # esperam a decisao de onde eles rodam em producao (CONTRIBUTING.md, secao 13, item 8).
    name: Imagem ${{ matrix.site }}
    runs-on: ubuntu-latest
    needs: [affected]
    if: needs.affected.outputs.web == 'true'
    strategy:
      fail-fast: false
      matrix:
        site: [storefront, admin-dashboard]
    steps:
      - uses: actions/checkout@v4
      - name: Montar a imagem
        run: docker build --target runtime -f "apps/ecommerce/${{ matrix.site }}/Dockerfile" -t "revold/${{ matrix.site }}:ci" .

  e2e:
    # A prova de cliente da loja (Playwright): navega, poe no carrinho, fecha o pedido pelo
    # WhatsApp e busca um produto, contra a pilha de verdade (Postgres, Redis, API e loja do
    # docker-compose.yml). Protege o caminho do dinheiro, que nenhum outro job exercita.
    #
    # O Playwright roda NO RUNNER, e nao num container: o navegador precisa alcancar a loja e a
    # API pelas portas publicadas (3000 e 8000), como um cliente de verdade. Ensaiado em
    # 2026-11-15: os 2 testes passam, e com o checkout quebrado de proposito o primeiro reprova.
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [affected]
    if: needs.affected.outputs.e2e == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - name: Configuracao da pilha
        # O compose le o `.env`. Os valores do `.env.example` sao os de desenvolvimento (todo
        # provedor no adapter local, sem credencial); o checkout precisa de um numero de destino,
        # e este e de mentira.
        run: sed 's/^NICK_WHATSAPP_NUMBER=.*/NICK_WHATSAPP_NUMBER=5500000000000/' .env.example > .env
      - name: Subir banco, fila, API e loja
        run: docker compose up -d --build --wait postgres redis api-gateway storefront
      - name: Migracoes
        run: docker compose exec -T api-gateway alembic upgrade head
      - name: Esperar a loja responder
        # O `next dev` compila a pagina no primeiro acesso: sem isto, o primeiro teste gasta o
        # proprio tempo esperando a compilacao.
        run: |
          for i in $(seq 1 40); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 http://localhost:3000/ || true)"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "::error::A loja nao respondeu 200 em http://localhost:3000/ (ultimo codigo: $code)."
          exit 1
      - name: Instalar o workspace e o navegador
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter storefront exec playwright install --with-deps chromium
      - name: Testes E2E
        run: pnpm --filter storefront exec playwright test
      - name: Logs da pilha
        if: failure()
        run: docker compose logs --no-color api-gateway storefront | tail -n 300
      - name: Rastro dos testes que falharam
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: apps/ecommerce/storefront/test-results/
          retention-days: 7
      - name: Derrubar a pilha
        if: always()
        run: docker compose down -v

  security:
    name: Seguranca
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: pip-audit - vulnerabilidade conhecida nas dependencias
        # Informativo: reprova quando o time decidir tratar o que ele aponta. Le o uv.lock
        # exportado, que e o que as imagens instalam.
        run: |
          uv export --frozen --format requirements-txt --no-hashes --no-emit-workspace -o /tmp/req-auditoria.txt
          uv run --with pip-audit pip-audit --requirement /tmp/req-auditoria.txt
        continue-on-error: true

      - name: bandit - padrao inseguro no codigo
        # GATE em severidade media ou alta. O codigo esta em zero achados (medido em
        # 2026-11-14), entao nao ha baseline: achado novo reprova. B101 (assert) e ruido.
        run: >-
          uv run --with 'bandit[toml]' bandit -r
          apps/ecommerce/api-gateway/src apps/ecommerce/event-worker/src apps/ecommerce/catalog-indexer/src
          libs/platform libs/integrations libs/domains products/ecommerce/src tooling/src scripts
          -ll --skip B101 -x '*/tests/*,*/evals/*'

      - name: Nenhum segredo conhecido commitado
        # Procura as credenciais que ESTE projeto usa, atribuidas a um literal no codigo. E a
        # segunda camada: a primeira e o secret scanning com push protection do GitHub, que recusa
        # o push antes de o segredo chegar aqui (CONTRIBUTING.md, secao 13, item 5).
        run: |
          nomes='MERCADO_PAGO_ACCESS_TOKEN|MERCADO_PAGO_WEBHOOK_SECRET|AZURE_OPENAI_API_KEY|DEEPSEEK_API_KEY|WHATSAPP_BUSINESS_ACCESS_TOKEN|SMTP_PASSWORD|AZURE_STORAGE_CONNECTION_STRING|AZURE_AD_CLIENT_SECRET|GOOGLE_CLIENT_SECRET'
          if git grep -nIE "($nomes)[[:space:]]*[=:][[:space:]]*['\"][^'\"]+['\"]" -- '*.py' '*.ts' '*.tsx' '*.yml' '*.yaml' '*.tf' ':!*/tests/*'; then
            echo "::error::Credencial aparentemente hardcoded. Use o .env local ou o Key Vault.";
            exit 1;
          fi
          echo "Nenhuma credencial conhecida hardcoded."

  images:
    # O fecho e a imagem de cada app Python. Prova duas coisas que so aparecem aqui: o
    # Dockerfile ainda monta, e o `uv sync --package` instala tudo o que o app importa (o
    # ambiente de teste tem TODAS as unidades; a imagem so leva o fecho declarado).
    name: Imagem ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: [affected, lint, architecture, tests]
    # `tests` pode ser pulado de proposito (PR que nao afeta unidade Python). Com `needs:` puro,
    # o skip dele pularia este job tambem; aqui ele so nao roda se algo FALHOU ou foi cancelado.
    if: >-
      always() && needs.affected.outputs.python == 'true'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    strategy:
      fail-fast: false
      matrix:
        app: [api-gateway, event-worker, catalog-indexer]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Instalar o workspace
        run: uv sync --frozen
      - name: Fecho do app, com BOM
        run: |
          uv run dev build "${{ matrix.app }}"
          cat "dist/${{ matrix.app }}/${{ matrix.app }}.bom.json"
      - name: Montar a imagem
        run: docker build --target runtime -f "apps/ecommerce/${{ matrix.app }}/Dockerfile" -t "revold/${{ matrix.app }}:ci" .
      - name: O app importa dentro da imagem
        run: |
          modulo="$(echo "${{ matrix.app }}" | tr '-' '_')"
          docker run --rm "revold/${{ matrix.app }}:ci" python -c "import importlib, pkgutil, ${modulo}; [importlib.import_module(m.name) for m in pkgutil.walk_packages(${modulo}.__path__, '${modulo}.')]; print('ok')"

  ci-ok:
    # Check agregado, para o ruleset da `main` exigir UM nome so em vez de dez.
    #
    # O id do job e `ci-ok`. O `name` e `CI OK`, que e o texto que o GitHub usa como contexto
    # do status check: o ruleset (scripts/setup-rulesets.sh) exige `CI OK`. Trocar o `name`
    # quebraria o merge de todo PR aberto ate alguem atualizar o ruleset.
    #
    # DUAS ARMADILHAS, as duas resolvidas aqui. As duas fazem o gate PARECER que protege
    # enquanto nao protege:
    #
    # 1. `if: always()` + checagem explicita de `result`. Com `needs:` puro, um job que falha
    #    faz este aqui ser **skipped**, nao **failed**. Check obrigatorio que aparece como
    #    "skipped" nao protege: a merge passa.
    #
    # 2. **Todo job de gate precisa estar neste `needs`.** Job fora da lista pode ficar
    #    VERMELHO com o `CI OK` VERDE, porque o agregado nunca olha para ele.
    #
    # AO ADICIONAR UM JOB NOVO: bota o nome dele no `needs` e na checagem abaixo. Job fora
    # desta lista nao reprova nada. O teste e direto: quebre o job de proposito num PR em draft
    # e confirme que o `CI OK` fica vermelho.
    name: CI OK
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, hooks, architecture, affected, tests, tests-azure-sql, frontend, site-images, e2e, security, images]
    steps:
      - name: Conferir o resultado de cada job
        run: |
          falhou=0

          # `tests` e `images` so podem ser `skipped` quando o `affected` disse que nenhuma
          # unidade Python foi tocada. Em qualquer outro caso, skip e falha: teste que nao
          # rodou nao aprovou.
          for r in "${{ needs.tests.result }}" "${{ needs.images.result }}"; do
            case "$r/${{ needs.affected.outputs.python }}" in
              success/*|skipped/false) ;;
              *) falhou=1 ;;
            esac
          done

          # tests-azure-sql: Fase 5 do plano de migracao Postgres -> Azure SQL (docs
          # internos). Esta no `needs` (resolve a armadilha 2 acima -- o job e VISTO pelo
          # agregado) e o result dele E conferido aqui embaixo, mas DE PROPOSITO nao soma
          # pra `falhou`: fica nao-bloqueante ate o health-check do service container
          # (novo, mais lento que o do Postgres) provar estavel por um numero de PRs
          # seguidos. So avisa, nao trava o merge. Promover a obrigatorio: mover o case
          # dele pro mesmo formato do `tests`/`images` acima (soma pra `falhou`).
          case "${{ needs.tests-azure-sql.result }}/${{ needs.affected.outputs.python }}" in
            success/*|skipped/false) ;;
            *) echo "::warning::tests-azure-sql terminou em '${{ needs.tests-azure-sql.result }}' -- nao-bloqueante ainda (Fase 5 do plano de migracao, ver comentario no job)." ;;
          esac
          # O `e2e` so pode ser `skipped` quando nem a loja nem a API foram afetadas.
          case "${{ needs.e2e.result }}/${{ needs.affected.outputs.e2e }}" in
            success/*|skipped/false) ;;
            *) falhou=1 ;;
          esac
          # O mesmo para o `frontend` e o `site-images`: skip so vale quando nenhuma unidade
          # TypeScript foi afetada.
          for r in "${{ needs.frontend.result }}" "${{ needs.site-images.result }}"; do
            case "$r/${{ needs.affected.outputs.web }}" in
              success/*|skipped/false) ;;
              *) falhou=1 ;;
            esac
          done

          for r in "${{ needs.lint.result }}" \
                   "${{ needs.hooks.result }}" \
                   "${{ needs.architecture.result }}" \
                   "${{ needs.affected.result }}" \
                   "${{ needs.security.result }}"; do
            [ "$r" != "success" ] && falhou=1
          done
          if [ "$falhou" -eq 1 ]; then
            echo "::error::Algum job do CI nao terminou em success."
            echo "  lint=${{ needs.lint.result }}  hooks=${{ needs.hooks.result }}  architecture=${{ needs.architecture.result }}  security=${{ needs.security.result }}"
            echo "  affected=${{ needs.affected.result }} (python=${{ needs.affected.outputs.python }}, web=${{ needs.affected.outputs.web }})"
            echo "  tests=${{ needs.tests.result }}  images=${{ needs.images.result }} (skipped so vale com python=false)"
            echo "  tests-azure-sql=${{ needs.tests-azure-sql.result }} (nao-bloqueante, Fase 5 -- ver comentario no job)"
            echo "  frontend=${{ needs.frontend.result }}  site-images=${{ needs.site-images.result }} (skipped so vale com web=false)"
            echo "  e2e=${{ needs.e2e.result }} (skipped so vale com e2e=false)"
            exit 1
          fi
          echo "Codigo pronto para merge."

