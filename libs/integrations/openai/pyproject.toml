[project]
name = "revold-openai"
version = "0.1.0"
description = "Clientes de modelos no protocolo OpenAI: Azure OpenAI e endpoints compatíveis (DeepSeek)."
requires-python = ">=3.12"
# Dependencias internas sem pino: o uv.lock unico e o workspace resolvem a versao.
dependencies = [
    "langchain-openai>=0.2,<0.3",
    "langchain-core>=0.3,<0.4",
    "pydantic>=2.9,<3",
]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revold_openai"]
