[project]
name = "revold-azure-blob"
version = "0.1.0"
description = "Cliente do Azure Blob Storage: grava e apaga um blob e devolve a URL pública dele."
requires-python = ">=3.12"
# Dependencias internas sem pino: o uv.lock unico e o workspace resolvem a versao.
dependencies = ["azure-storage-blob>=12.23,<13", "aiohttp>=3.14.3,<4"]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revold_azure_blob"]
