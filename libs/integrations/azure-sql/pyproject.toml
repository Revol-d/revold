[project]
name = "revold-azure-sql"
version = "0.1.0"
description = "Cliente do Azure SQL Database: engine, fábrica de sessão e a base declarativa do SQLAlchemy."
requires-python = ">=3.12"
# Dependencias internas sem pino: o uv.lock unico e o workspace resolvem a versao.
dependencies = ["sqlalchemy>=2.0.35,<3", "aioodbc>=0.5.0,<0.6"]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revold_azure_sql"]
