[project]
name = "revold-ai-assistant"
version = "0.1.0"
description = "Assistente de IA: busca por similaridade no catálogo indexado e resposta com LangGraph."
requires-python = ">=3.12"
# Dependencias internas sem pino: o uv.lock unico e o workspace resolvem a versao.
dependencies = [
    "revold-postgres",
    "revold-azure-sql",
    "revold-openai",
    "pydantic>=2.9,<3",
    "langgraph>=0.2,<0.3",
    "sqlalchemy>=2.0.35,<3",
    "pgvector>=0.3.5,<0.4",
]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revold_ai_assistant"]
