[project]
name = "revold-notification"
version = "0.1.0"
description = "Avisos operacionais para a loja: novo checkout e estoque baixo."
requires-python = ">=3.12"
# Dependencias internas sem pino: o uv.lock unico e o workspace resolvem a versao.
dependencies = ["revold-smtp", "revold-whatsapp"]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revold_notification"]
