[project]
name = "revold-cart"
version = "0.1.0"
description = "Carrinho de compras: itens, quantidades e total."
requires-python = ">=3.12"
# Dependencias internas sem pino: o uv.lock unico e o workspace resolvem a versao.
dependencies = ["pydantic>=2.9,<3", "redis>=5.0.8,<6"]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revold_cart"]
