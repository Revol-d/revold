[project]
name = "revold-communication"
version = "0.1.0"
description = "Passagem do checkout para um canal de conversa com a loja."
requires-python = ">=3.12"
# Dependencias internas sem pino: o uv.lock unico e o workspace resolvem a versao.
dependencies = ["revold-whatsapp"]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revold_communication"]
