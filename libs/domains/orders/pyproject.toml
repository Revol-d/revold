[project]
name = "revold-orders"
version = "0.1.0"
description = "Pedidos: criação a partir do carrinho e transições de pagamento e de atendimento."
requires-python = ">=3.12"
# Dependencias internas sem pino: o uv.lock unico e o workspace resolvem a versao.
dependencies = [
    "revold-azure-sql",
    "pydantic>=2.9,<3",
    "sqlalchemy>=2.0.35,<3",
]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revold_orders"]
