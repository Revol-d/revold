[project]
name = "revold-identity"
version = "0.1.0"
description = "Identidade: login federado, sessão, papéis, API key e limite de requisições."
requires-python = ">=3.12"
# Dependencias internas sem pino: o uv.lock unico e o workspace resolvem a versao.
dependencies = [
    "revold-postgres",
    "revold-azure-sql",
    "pydantic>=2.9,<3",
    "redis>=5.0.8,<6",
    "sqlalchemy>=2.0.35,<3",
]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revold_identity"]
